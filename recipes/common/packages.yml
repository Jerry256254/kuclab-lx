---
# yaml-language-server: $schema=https://schema.blue-build.org/module-v1.json
# Minimalni sada RPM: terminal, Brave, VPN, Wine/Proton vrstva pro WinShit,
# knihovny pro nase GTK aplikace. Zbytek jede jako flatpak.
type: dnf
repos:
  files:
    add:
      - https://repository.mullvad.net/rpm/stable/mullvad.repo
      - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
  keys:
    - https://repository.mullvad.net/rpm/mullvad-keyring.asc
    - https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
install:
  packages:
    # terminal (jednoduchy, rychly)
    - ptyxis
    # prohlizec: originalni Brave (free), DuckDuckGo se nastavuje pres policy
    - brave-browser
    # vpn
    - mullvad-vpn
    # WinShit: Wine/Proton vrstva (umu spousti proton-ge buildy)
    # umu neni ve Fedora repositarich -> oficialni RPM z GitHub releases
    # (pri nove Fedore zkontroluj, ze asset pro fc%OS_VERSION% existuje)
    - wine-core
    - winetricks
    - https://github.com/Open-Wine-Components/umu-launcher/releases/download/1.4.4/umu-launcher-1.4.4.fc%OS_VERSION%.x86_64.rpm
    # behove knihovny pro KucLab aplikace (GTK4 + GObject introspekce)
    - python3-gobject
    - gtk4
    - libadwaita
    - flatpak-libs
    - appstream
    - pipewire-utils
remove:
  packages:
    # pryc s duplicitnim obchodem, mame vlastni Store
    - gnome-software
    - gnome-software-rpm-ostree
  auto-remove: false
